name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version package.json declares, so a contributor's local run
          # resolves the same tree this does.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
